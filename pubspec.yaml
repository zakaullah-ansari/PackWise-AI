name: packwise_ai
description: >
  PackWise AI — Intelligent Food Packaging Recommendation System.
  An AgriTech/FoodTech Flutter application that uses Google Gemini AI to
  recommend optimized food packaging materials based on commodity
  properties (moisture, fat, pH, respiration rate, shelf life, storage
  conditions). Built for the Smart India Hackathon (SIH) and as a
  university workshop teaching resource (MVVM + Provider architecture).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ---------------------------------------------------------------------
  # State Management & Architecture (MVVM ViewModels)
  # ---------------------------------------------------------------------
  provider: ^6.1.2

  # ---------------------------------------------------------------------
  # Firebase (Auth + Firestore for history persistence)
  # ---------------------------------------------------------------------
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # ---------------------------------------------------------------------
  # Networking (Gemini REST API)
  # ---------------------------------------------------------------------
  http: ^1.2.2

  # ---------------------------------------------------------------------
  # UI / Design System
  # ---------------------------------------------------------------------
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  qr_flutter: ^4.1.0

  # ---------------------------------------------------------------------
  # Utilities
  # ---------------------------------------------------------------------
  intl: ^0.19.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

  # ---------------------------------------------------------------------
  # Local environment configuration (.env) — optional convenience layer
  # on top of --dart-define; see .env.example and ApiConstants.geminiApiKey.
  # ---------------------------------------------------------------------
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # `.env` holds the (git-ignored) local Gemini API key — see .env.example
  # and the "Configure your Gemini API key" section of the README. The file
  # must exist on disk before `flutter run`/`flutter build` (copy it from
  # .env.example) because Flutter validates declared asset paths at build
  # time; lib/main.dart loads it defensively and the app still runs fine via
  # --dart-define or fully offline if it's missing.
  #
  # Add any real image/icon assets under their own paths here too, e.g.:
  #   - assets/images/
  #   - assets/icons/
  assets:
    - .env
