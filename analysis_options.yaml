include: package:flutter_lints/flutter.yaml

# ---------------------------------------------------------------------------
# PackWise AI static analysis configuration.
#
# We extend the official `flutter_lints` recommended rule-set and layer a
# small number of additional rules that keep the codebase consistent for a
# multi-contributor / teaching context (SIH team + university workshop).
# ---------------------------------------------------------------------------
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    - always_declare_return_types
    - annotate_overrides
    - avoid_print
    - avoid_empty_else
    - avoid_return_types_on_setters
    - avoid_unnecessary_containers
    - cancel_subscriptions
    - close_sinks
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unawaited_futures
    - unnecessary_null_checks
    - use_key_in_widget_constructors
